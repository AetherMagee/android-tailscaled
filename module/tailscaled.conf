# android-tailscaled daemon settings. Survives module updates.
# Edit here or in the WebUI, then run: tailscaled.service restart
#
# Tailscale preferences (exit node, routes, hostname, ...) are not set here;
# use `tailscale set` or the WebUI for those.

# UDP port for WireGuard. 0 picks a random port.
PORT=41641

# tailscale0 = kernel TUN (real routes, every app can reach the tailnet).
# userspace-networking = no TUN, no routes; only tailscaled's SOCKS5/HTTP proxy.
TUN=tailscale0

# Priority of Tailscale's ip rule ("not fwmark 0x40000000/0x60000000 lookup 52").
# 9999: after TPROXY proxies such as MaterialXray (9990, probes 9991-9998), before
#       all of Android's own rules (10000+) including VPN apps. Proxied apps reach
#       the tailnet only if the proxy bypasses 100.64.0.0/10.
# 5270: upstream default; Tailscale (and the exit node) before everything.
#       TPROXY proxies that check for conflicting rules will refuse to start.
IP_RULE_PRIORITY=9999

# Extra tailscaled flags, e.g. "--socks5-server=localhost:1055 --verbose=1".
EXTRA_ARGS=""

# Environment for tailscaled can be exported here too.
# Use TLS (443) for the control connection instead of trying plain HTTP (80)
# first. Networks with DPI (e.g. in Russia) stall port 80 once enough data
# flows, which leaves tailscaled stuck in NoState for minutes.
export TS_FORCE_NOISE_443=1
